name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck -S warning scripts/factory/*.sh scripts/dev/*.sh tests/*.sh
      - name: every script is executable (reset-ticket.sh wasn't, and /factory-rereview failed)
        run: |
          bad="$(git ls-files -s 'scripts/*.sh' 'scripts/**/*.sh' | awk '$1 != "100755" { print $4 }')"
          [ -z "$bad" ] || { echo "not executable in git: $bad (git update-index --chmod=+x <file>)"; exit 1; }
      - name: node syntax
        run: for f in scripts/factory/*.mjs; do node --check "$f"; done
      - name: skills pin (v1.3.1, no shadows)
        run: bash scripts/factory/skills-pin.sh verify
      - name: command guard rules
        run: node --test tests/guard.test.mjs tests/guard-replay.test.mjs tests/learn-export.test.mjs tests/cockpit-contract.test.mjs tests/run-detail.test.mjs tests/archive.test.mjs tests/node-version.test.mjs tests/gate-doc.test.mjs
      - name: cockpit, driven like a person, on the gym's records (D123)
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node --test tests/cockpit-ui.test.mjs
      - name: end-to-end mission without models
        run: bash tests/factory.test.sh
      - name: the same mission as one project of a monorepo
        run: FACTORY_TEST_MONOREPO=1 bash tests/factory.test.sh

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Conventional Commits
        run: |
          npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

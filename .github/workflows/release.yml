name: release

# develop → prereleases (x.y.z-rc.N), main → releases. Versions, tags,
# CHANGELOG.md and .factory/VERSION come from Conventional Commits.
on:
  push:
    branches: [develop, main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: tests first
        run: bash tests/factory.test.sh
      - name: semantic-release
        env:
          # RELEASE_TOKEN: fine-grained token of a repo admin on the ruleset's
          # bypass list, so the release commit can land on protected develop/main.
          # Falls back to the default token while the secret doesn't exist.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
      # After a release on main, bring the release commit (CHANGELOG.md,
      # .factory/VERSION) back into develop, so the next develop → main has no
      # conflict and nobody opens a sync PR by hand. Uses RELEASE_TOKEN, whose
      # owner bypasses the ruleset. [skip ci]: nothing new to test or release.
      - name: sync develop with main
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main: nothing to sync."
            exit 0
          fi
          git switch -C develop origin/develop
          if ! git merge --no-ff origin/main -m "chore: sync develop with main [skip ci]"; then
            echo "::error::develop and main conflict: open a main → develop PR and resolve it by hand."
            exit 1
          fi
          git push origin develop

# Agentic factory: CI gates. See docs/adr/ADR-001-agentic-factory.md.
#
# Why the gate lives here (D9): CI is the one checkpoint nobody can skip
# silently, and it is the same for everyone, whether they use Pi or OpenCode.
#
# REQUIRED project setting, or the gate is only advisory:
#   Settings → Merge requests → "Pipelines must succeed"

variables:
  GIT_DEPTH: "0"                    # verdict freshness needs full history
  FACTORY_IMAGE: "alpine:3.20"      # override with your internal registry image

stages:
  - build
  - test
  - factory

# --- Deterministic checks first (D8) -------------------------------------
# Keep your existing lint / typecheck / test / security jobs in build and
# test. The factory gate runs only after they pass, so the LLM reviewer's
# work is never spent on a red build. Example placeholders:
#
# lint:
#   stage: test
#   script: [npm ci, npm run lint, npm run typecheck]
#
# unit-tests:
#   stage: test
#   script: [npm ci, npm test]
#
# include:
#   - template: Jobs/SAST.gitlab-ci.yml        # security scan (Step 2 ingredient)
#   - template: Jobs/Secret-Detection.gitlab-ci.yml

# --- Factory gate: G1–G4, lanes, instrument rule (D9–D11, D23) -----------
factory-gate:
  stage: factory
  image: $FACTORY_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - command -v bash >/dev/null && command -v git >/dev/null || apk add --no-cache bash git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - bash scripts/factory/gate.sh mr "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# --- Behavior replay (D14, D21) -------------------------------------------
# Reruns the instrument in CI, so a behavior verdict isn't trusted on the
# agent's word alone. CI sees the instrument; worker worktrees never do. Enable when the bot harness exists
# (rollout step 3). Until then it stays manual and non-blocking.
behavior-replay:
  stage: factory
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - echo "TODO(harness): ./harness run instrument/scenarios (runs and thresholds from each case)"

# --- Factory configuration (D31, D36) ---------------------------------------
# Pinned skills untouched and unshadowed; every subagent on its own model,
# judges on other families. Blocking.
factory-config:
  stage: factory
  image: $FACTORY_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - command -v bash >/dev/null && command -v node >/dev/null || apk add --no-cache bash nodejs
  script:
    - bash scripts/factory/skills-pin.sh verify
    - node scripts/factory/models-lint.mjs

# --- Readiness (D28) --------------------------------------------------------
# Advisory for now: reports what the repo still lacks for Step 2.
factory-readiness:
  stage: factory
  image: $FACTORY_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  before_script:
    - command -v bash >/dev/null || apk add --no-cache bash
  script:
    - bash scripts/factory/readiness.sh --strict

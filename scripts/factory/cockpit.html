<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Cockpit</title>
<style>
:root{--bg:#0F1115;--panel:#171A21;--line:#262B35;--ink:#E7E9EE;--soft:#9AA3B2;--dim:#6B7383;--amber:#F2A93B;--green:#3DD68C;--blue:#6CB4FF;--red:#FF7A6B;--violet:#B79CFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header{flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.crumbs{color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--blue);text-decoration:none}
.spacer{flex:1}
.keys{color:var(--dim);font-size:12px}
.keys b{color:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:500}
.age{color:var(--dim);font-size:12px}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:16px}
.leads{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.mc{grid-template-columns:minmax(300px,1.1fr) minmax(280px,1fr) minmax(300px,1.1fr)}
@media (max-width:1100px){.mc{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft);margin:0 0 12px;font-weight:600}
.card{cursor:pointer;transition:border-color .15s}
.card:hover,.card.sel{border-color:var(--blue)}
.title{font-size:16px;font-weight:650;margin:2px 0 6px}
.muted{color:var(--soft)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.s-pass{color:var(--green);border-color:#1f4d36;background:#11261c}
.s-review{color:var(--blue);border-color:#24476b;background:#122133}
.s-build{color:var(--violet);border-color:#41376a;background:#1d1830}
.s-escalate,.s-fail{color:var(--red);border-color:#6b2c26;background:#2b1513}
.s-blocked{color:var(--dim)}
.s-human{color:var(--amber);border-color:#6b4b14;background:#2a2010}
.bar{height:6px;background:#222733;border-radius:4px;overflow:hidden;margin:10px 0 6px;display:flex}
.bar i{display:block;height:100%}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--soft);font-size:12.5px}
.stat b{color:var(--ink);font-weight:600}
.needs{border-color:#6b4b14}
.need{border-left:3px solid var(--amber);padding:8px 10px;margin:8px 0;background:#1d1a14;border-radius:0 8px 8px 0;white-space:pre-wrap;word-break:break-word}
.need .k{color:var(--amber);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.list li:hover,.list li.sel{background:#1E232D}
.list .n{color:var(--dim);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .r{color:var(--dim);font-size:12px}
.log li{cursor:default;align-items:flex-start;padding:5px 4px}
.log .when{color:var(--dim);width:92px;flex:none;font-size:12px}
.term{background:#0B0D11;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#C9D1DC}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600;font-size:12px}
.assert{margin:6px 0;padding:8px 10px;background:#12151B;border-radius:8px}
.assert .id{color:var(--blue);font-weight:600;font-size:12px}
.empty{color:var(--dim);font-style:italic}
.err{color:var(--red);padding:20px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.recs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.rec .k{color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.rec .v{font-size:16px;font-weight:650;margin:4px 0}
.warn{color:var(--amber);margin:6px 0}
select{background:#12151B;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.scatter text{fill:var(--soft);font-size:11px}
.scatter .pt text{fill:var(--ink);font-size:12px}
.waiting{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:8px;text-decoration:none;font-size:13px;min-width:0}
.waiting b{white-space:nowrap}.waiting span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-you{background:#2a2010;color:var(--amber);border:1px solid #6b4b14}
.w-factory{background:#11261c;color:var(--green);border:1px solid #1f4d36}
.w-lead,.w-nobody{background:#1E232D;color:var(--soft);border:1px solid var(--line)}
.inbox{display:grid;gap:16px}
.ask{border-color:#6b4b14;padding:0;overflow:hidden}
.ask .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1d1a14;border-bottom:1px solid #3a2e17}
.ask .k{color:var(--amber);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.ask .body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;padding:16px}
@media (max-width:900px){.ask .body{grid-template-columns:1fr}}
.ask .q{font-size:17px;font-weight:650;margin:0 0 12px;line-height:1.35}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.opt.sug{border:2px solid var(--blue)}
.opt .l{font-weight:600}.opt .tag{font-size:11px;font-weight:700;background:var(--blue);color:#0F1115;border-radius:4px;padding:1px 6px;margin-left:6px}
.opt .e{color:var(--soft);margin:4px 0 8px}
.cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmd code{flex:1 1 240px;background:#0B0D11;border:1px solid var(--line);border-radius:6px;padding:6px 9px;word-break:break-all}
button.copy{font:inherit;font-size:12.5px;background:#1E232D;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer}
.ev{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ev li{display:grid;grid-template-columns:70px 1fr;gap:8px}
.ev .lab{font-weight:600;font-size:12px;color:var(--soft)}
.ev .lab.bad{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;align-items:start}
.col h2{display:flex;gap:8px}.col .cards{display:grid;gap:12px}
.col .none{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--dim);font-size:13px}
.tl{width:100%;display:block}.tl text{fill:var(--soft);font-size:11px;font-family:inherit}
.tl .run{cursor:pointer}.tl .run:hover{opacity:.8}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.metrics .v{font-size:19px;font-weight:650}.metrics .k{color:var(--soft);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--soft);margin-top:8px}
.evs{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0B0D11}
.evs .e{display:grid;grid-template-columns:72px 78px 1fr;gap:10px;padding:6px 10px;border-bottom:1px solid #1A1E26;font-size:12.5px}
.evs .e.bad{background:#2b1513}.evs .e .w{color:var(--dim)}.evs .e .x{white-space:pre-wrap;word-break:break-word}
.evs .e .res{color:var(--soft);margin-top:3px}
.refusal{border:1px solid #6b2c26;border-radius:10px;overflow:hidden;margin-bottom:12px}
.refusal .h{background:#2b1513;color:var(--red);padding:8px 12px;font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.refusal .b{padding:10px 12px;display:grid;gap:8px}
.today-allowed{color:var(--green)}.today-refused{color:var(--red)}.today-unknown{color:var(--amber)}
.tabs{display:flex;gap:6px}.tabs button{font:inherit;font-size:12.5px;background:#1E232D;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:32px;cursor:pointer}
.tabs button.on{border-color:var(--blue);color:var(--blue)}
details summary{cursor:pointer;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>Factory Cockpit</h1>
  <nav class="crumbs" id="crumbs"></nav>
  <a class="waiting w-nobody" id="waiting" href="#/"></a>
  <span class="spacer"></span>
  <span class="keys"><b>N</b> needs you · <b>L</b> missions · <b>H</b> health · <b>B</b> benchmarks · <b>M</b> mission · <b>R</b> rounds · <b>↑↓</b> ticket · <b>Enter</b> open · <b>Esc</b> up</span>
  <span class="age" id="age"></span>
</header>
<main id="app"><p class="muted">Loading state.json…</p></main>
<script>
"use strict";
let state = null, sel = 0, lastOk = 0, lastText = "";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const route = () => { const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent); return { m: p[0] === "m" ? p[1] : "", t: p[2] === "t" ? p[3] : "", run: p[2] === "run" ? p[3] : "", b: p[0] === "bench" ? (p[1] || "-") : "", list: p[0] === "missions", h: p[0] === "health" }; };
const go = (m, t) => { location.hash = m ? `#/m/${encodeURIComponent(m)}${t ? `/t/${encodeURIComponent(t)}` : ""}` : "#/missions"; };
const STATE_LABEL = { pass: "PASS", review: "review", build: "build", escalate: "ESCALATE", blocked: "blocked" };
const pill = (s) => `<span class="pill s-${esc(s)}">${esc(STATE_LABEL[s] || s)}</span>`;
const stepPill = (m) => m.phase === "closed" ? `<span class="pill s-pass" title="${esc(m.mr)}">closed</span>` : m.otherBranch ? `<span class="pill s-blocked" title="${esc(m.next)}">on ${esc(m.otherBranch)}</span>`
  : `<span class="pill ${m.human ? "s-human" : "s-review"}">${esc(m.step || "?")}${m.human ? " · needs you" : ""}</span>`;
const fmtK = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; return s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : s < 129600 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 86400)} d`; };
const mission = (name) => state.missions.find((x) => x.name === name);
const active = (m) => m.tickets.find((t) => t.state === "review") || m.tickets.find((t) => t.state === "build") || m.tickets.find((t) => t.state === "escalate") || m.tickets[m.tickets.length - 1];

function bar(m) {
  const c = m.counts, total = c.total || 1, seg = (k, col) => c[k] ? `<i style="width:${(100 * c[k]) / total}%;background:${col}"></i>` : "";
  return `<div class="bar">${seg("pass", "var(--green)")}${seg("review", "var(--blue)")}${seg("build", "var(--violet)")}${seg("escalate", "var(--red)")}${seg("blocked", "#3a4150")}</div>`;
}

function interventions(m) {
  const i = m.interventions, over = i.human > i.target;
  return `<span>decisions <b style="color:${over ? "var(--red)" : "var(--ink)"}">${i.human}</b>/${i.target}</span><span>auto-answered <b>${i.auto}</b></span>`;
}

// D97: the factory engineer's line, across every mission (metrics.sh --all).
function factoryLine() {
  const f = state.factory; if (!f || !f.missions) return "";
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "-");
  const v = (x) => (x === null || x === undefined ? "-" : x);
  return `<div class="panel" style="margin-bottom:16px"><h2>Factory · all missions</h2><div class="stat">
    <span><b>${f.missions}</b> missions</span><span><b>${f.mrs}</b> MRs</span>
    <span>cost per MR <b>${v(f.costPerMr)}</b></span><span>interventions per MR <b>${v(f.decisionsPerMr)}</b></span>
    <span>first pass <b>${pct(f.firstPass, f.reviewed)}</b></span>
    <span>rounds per ticket <b>${f.reviewed ? (f.rounds / f.reviewed).toFixed(1) : "-"}</b></span>
    <span>scored runs <b>${f.scored}</b> (${f.scoreFails} fail)</span></div></div>`;
}

// D119: runs by role, from the run archive; red ticks are the guard's refusals.
const ROLE_COLOR = { "ticket-writer": "#9AA3B2", worker: "#6CB4FF", "worker-heavy": "#3D7BD9", reviewer: "#3DD68C", "review-axis": "#2BA36B",
  validator: "#B79CFF", "code-steward": "#E0B44C", "contract-author": "#C9A0DC", "contract-critic": "#A07CC0", you: "#F2A93B" };
const roleColor = (r) => ROLE_COLOR[r] || "#7C8798";
const hhmm = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const dur = (ms) => ms >= 3600e3 ? `${Math.floor(ms / 3600e3)} h ${String(Math.round((ms % 3600e3) / 60e3)).padStart(2, "0")}` : ms >= 60e3 ? `${Math.floor(ms / 60e3)} m ${String(Math.round((ms % 60e3) / 1e3)).padStart(2, "0")}` : `${Math.round(ms / 1e3)} s`;
function timelineSvg(m, mini) {
  const runs = m.timeline || [];
  const decisions = mini ? [] : (m.log || []).filter((e) => e.kind === "decision").map((e) => Date.parse(e.date)).filter((t) => !isNaN(t));
  if (!runs.length) return mini ? "" : `<p class="empty">No archived run yet (scripts/factory/archive.sh collect ${esc(m.name)}).</p>`;
  const order = state.roles || [];
  const roles = [...new Set(runs.map((r) => r.role))].sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99));
  const lanes = decisions.length ? ["you", ...roles] : roles;
  const t0 = Math.min(...runs.map((r) => Date.parse(r.start)), ...decisions), t1 = Math.max(...runs.map((r) => Date.parse(r.end)), ...decisions);
  const W = 1000, L = mini ? 0 : 110, R = 8, lh = mini ? 9 : 26, bh = mini ? 7 : 18, top = 4, H = top + lanes.length * lh + (mini ? 2 : 22);
  const x = (t) => L + ((t - t0) / Math.max(t1 - t0, 1)) * (W - L - R);
  const y = (role) => top + lanes.indexOf(role) * lh;
  let out = "";
  if (!mini) {
    for (let i = 0; i <= 4; i++) { const t = t0 + ((t1 - t0) * i) / 4, xx = x(t);
      out += `<line x1="${xx}" y1="${top}" x2="${xx}" y2="${H - 18}" stroke="#262B35"/><text x="${xx}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${hhmm(t)}</text>`; }
    lanes.forEach((r) => { out += `<text x="0" y="${y(r) + bh - 4}">${esc(r)}</text>`; });
  }
  lanes.forEach((r) => { out += `<rect x="${L}" y="${y(r)}" width="${W - L - R}" height="${bh}" rx="2" fill="#1A1E26"/>`; });
  for (const r of runs) {
    const a = Date.parse(r.start), b = Date.parse(r.end), xx = x(a), w = Math.max(x(b) - xx, 2);
    const tip = `${r.role} ${r.run}${r.ticket ? " · ticket " + r.ticket : ""}\n${hhmm(a)}–${hhmm(b)} (${dur(b - a)}) · ${r.model}\n${r.calls ?? "?"} tool calls · ${r.refused.length} refused${r.cost ? ` · $${r.cost.toFixed(2)}` : ""}${r.result ? " · " + r.result : ""}`;
    out += `<rect class="run" data-dir="${mini ? "" : esc(r.dir || "")}" x="${xx}" y="${y(r.role)}" width="${w}" height="${bh}" rx="2" fill="${roleColor(r.role)}"><title>${esc(tip)}</title></rect>`;
    r.refused.forEach((g, i) => { const at = Date.parse(g.at); const tx = isNaN(at) || at < a || at > b ? xx + ((i + 1) * w) / (r.refused.length + 1) : x(at);
      out += `<rect x="${tx - 1}" y="${y(r.role) - (mini ? 1 : 3)}" width="2" height="${bh + (mini ? 2 : 6)}" fill="#FF5A4A"><title>${esc(`refused · ${g.rule} · ${g.tool}\n${g.input}`)}</title></rect>`; });
  }
  for (const t of decisions) out += `<rect x="${x(t) - 4}" y="${y("you") + bh / 2 - 4}" width="8" height="8" transform="rotate(45 ${x(t)} ${y("you") + bh / 2})" fill="${roleColor("you")}"><title>your decision · ${hhmm(t)}</title></rect>`;
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`${runs.length} runs by role from ${hhmm(t0)} to ${hhmm(t1)}`)}">${out}</svg>`;
}

const COLUMNS = [["needs-you", "Needs you"], ["running", "Running"], ["lead", "Lead's turn"], ["closed", "Closed"], ["parked", "On another branch"]];
function missionCard(m, i) {
  const s = m.span;
  return `<div class="panel card${i === sel ? " sel" : ""}" data-m="${esc(m.name)}">
      <div class="row"><span class="mono muted">${esc(m.name)}</span>${stepPill(m)}</div>
      <div class="title">${esc(m.title || m.name)}</div>
      ${bar(m)}${timelineSvg(m, true)}
      <div class="stat"><span><b>${m.counts.pass || 0}</b>/${m.counts.total} tickets</span>${interventions(m)}
        ${s ? `<span><b>$${s.cost.toFixed(2)}</b></span>${s.refused ? `<span style="color:var(--red)"><b>${s.refused}</b> refused</span>` : ""}` : m.usage ? `<span><b>${fmtK(m.usage.input + m.usage.output)}</b> tokens</span>` : ""}
        ${m.workers.some((w) => !w.done) ? `<span style="color:var(--green)">● agent running</span>` : ""}</div>
      ${m.phase === "needs-you" && m.needs.length ? `<div class="need"><span class="k">${esc(m.needs[0].kind)}</span> ${esc(m.needs[0].text.slice(0, 160))}</div>` : ""}
      <div class="age" style="margin-top:8px">${m.log[0] ? `last: ${esc(m.log[0].kind)}${m.log[0].ticket ? " " + esc(m.log[0].ticket) : ""} · ${ago(m.log[0].date)} ago` : ""}</div>
    </div>`;
}

function leads() {
  if (!state.missions.length) return `<p class="empty">No mission under ${esc(state.factoryDir)}/ yet.</p>`;
  const idx = new Map(state.missions.map((m, i) => [m.name, i]));
  return factoryLine() + `<div class="board">${COLUMNS.filter(([k]) => k !== "parked" || state.missions.some((m) => m.phase === k)).map(([k, label]) => {
    const ms = state.missions.filter((m) => (m.phase || "lead") === k);
    return `<section class="col"><h2>${esc(label)} <span class="muted">${ms.length}</span></h2><div class="cards">${ms.length ? ms.map((m) => missionCard(m, idx.get(m.name))).join("")
      : `<div class="none">${k === "running" ? "No agent running." : k === "needs-you" ? "Nothing waits for you." : k === "lead" ? "No mission waiting on the lead." : "None yet."}</div>`}</div></section>`; }).join("")}</div>
    <div class="legend">${Object.entries(ROLE_COLOR).filter(([r]) => r !== "you").map(([r, c]) => `<span><i style="background:${c}"></i>${esc(r)}</span>`).join("")}<span><i style="background:#FF5A4A;width:3px"></i>guard refusal</span></div>`;
}

function needsPanel(m) {
  return `<div class="panel needs"><h2>Needs you</h2>
    ${m.needs.length ? m.needs.map((n) => `<div class="need"><span class="k">${esc(n.kind)}${n.ticket ? " · " + esc(n.ticket) : ""}</span>\n${esc(n.text)}</div>`).join("") : `<p class="empty">${m.phase === "closed" ? "Nothing. The mission is closed." : m.phase === "lead" ? "Nothing. It's the lead's turn: " + esc(m.step) + "." : "Nothing. The factory is working."}</p>`}
    <div class="stat" style="margin-top:10px">${interventions(m)}</div></div>`;
}

function activePanel(m, t) {
  if (!t) return `<div class="panel"><h2>Active ticket</h2><p class="empty">No tickets yet. Next: ${esc(m.next)}</p></div>`;
  const pre = t.blockedBy.length ? t.blockedBy.map((b) => { const bt = m.tickets.find((x) => x.num === b); return `<li>${bt ? pill(bt.state) : ""}<span class="t">${esc(b)} ${esc(bt ? bt.title : "")}</span></li>`; }).join("") : `<li class="empty">none</li>`;
  return `<div class="panel"><h2>Active ticket</h2>
    <div class="row"><span class="mono muted">${esc(t.name)}</span>${pill(t.state)}</div>
    <div class="title">${esc(t.title)}</div>

function checklist(m, current) {

const KIND = { integrated: ["integrated", "s-pass"], verdict: ["verdict", ""], gate: ["gate", "s-review"], decision: ["decision", "s-human"], "auto-answer": ["auto", "s-blocked"], escalated: ["escalated", "s-escalate"], stale: ["stale", "s-blocked"], question: ["question", "s-human"], commit: ["commit", "s-blocked"] };
function logItem(e) {
  const [label, cls0] = KIND[e.kind] || [e.kind, ""];
  const cls = e.kind === "verdict" || e.kind === "gate" ? (e.ok === true ? "s-pass" : e.ok === false ? "s-fail" : cls0) : cls0;
  return `<li><span class="when">${ago(e.date)} ago</span><span class="pill ${cls}" style="min-width:78px;text-align:center">${esc(label)}</span>
    <span class="t" style="white-space:normal">${e.ticket ? `<b>${esc(e.ticket)}</b> ` : ""}<span class="muted" title="${esc(e.text)}">${esc(e.text.length > 170 ? e.text.slice(0, 168) + "…" : e.text)}</span></span></li>`;
}

function liveAndLog(m) {
  const w = m.workers;
  const workers = w.length ? w.map((x) => `<div style="margin-bottom:12px"><div class="row"><span><span class="dot" style="background:${x.done ? "var(--dim)" : x.quiet ? "var(--amber)" : "var(--green)"}"></span> <b>${esc(x.agent || "agent")}</b> ${esc(x.ticket)}</span><span class="age">${x.done ? "done" : "active"} · ${Math.round(x.ageSec / 60)} min ago</span></div>
      <pre class="term mono" data-key="w:${esc(x.run)}">${esc(x.last.join("\n"))}</pre></div>`).join("")
    : `<p class="empty">No agent run seen for this mission (pi-subagents run logs, best effort).</p>`;
  const runs = m.runs.slice(-4).reverse().map((r) => `<li><span class="when">${esc((r.date || "").slice(5))}</span><span class="t">${esc(r.agent)} <span class="muted">${esc(r.model)}${r.thinking ? " · " + esc(r.thinking) : ""}</span></span></li>`).join("");
  return `<div class="panel"><h2>Active worker</h2>${workers}
    ${runs ? `<h2 style="margin-top:6px">Last runs started</h2><ul class="list log">${runs}</ul>` : ""}
    <h2 style="margin-top:14px">Progress log</h2>
    <ul class="list log">${m.log.slice(0, 18).map(logItem).join("") || `<li class="empty">nothing recorded yet</li>`}</ul>
  </div>`;
}

function metricsRow(m) {
  const s = m.span; if (!s && !m.usage) return "";
  const cell = (k, v, red) => `<div><div class="k">${k}</div><div class="v"${red ? ` style="color:var(--red)"` : ""}>${v}</div></div>`;
  return `<div class="metrics">${s ? cell("Cost", "$" + s.cost.toFixed(2)) : ""}${m.usage ? cell("Tokens in / out", `${fmtK(m.usage.input)} / ${fmtK(m.usage.output)}`) : ""}
    ${s ? cell("Wall time", dur(Date.parse(s.end) - Date.parse(s.start))) + cell("Runs", s.runs) + cell("Tool calls", s.calls) + cell("Guard refusals", s.refused, s.refused > 0) : ""}
    ${cell("Your decisions", m.interventions.human)}</div>`;
}

// D121: one run, fetched on demand from cockpit.sh (run.json), never in the snapshot.
let runCache = { key: "", data: null, err: "" }, evFilter = "all";
function loadRun(m, dir) {
  const key = `${m}/${dir}`;
  if (runCache.key === key) return runCache;
  runCache = { key, data: null, err: "" };
  fetch(`run.json?m=${encodeURIComponent(m)}&r=${encodeURIComponent(dir)}`, { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status === 404 && location.protocol === "file:" ? "open the cockpit with cockpit.sh" : `HTTP ${r.status}`))))
    .then((d) => { if (runCache.key === key) { runCache.data = d; render(); } }, (e) => { if (runCache.key === key) { runCache.err = e.message; render(); } });
  return runCache;
}
const TODAY = { refused: "still refused today", allowed: "allowed today: fixed since", unknown: "can't be replayed" };
function runView(m, dir) {
  const c = loadRun(m.name, dir);
  if (c.err) return `<div class="panel"><p class="err">This run can't be read (${esc(c.err)}). Run details come from cockpit.sh and the run archive (archive.sh collect ${esc(m.name)}).</p></div>`;
  const d = c.data; if (!d) return `<p class="muted">Loading the run…</p>`;
  const u = d.usage || {}, ms = Date.parse(d.end) - Date.parse(d.start);
  const ticket = d.ticket && m.tickets.find((t) => t.name === d.ticket || t.name.startsWith(d.ticket));
  const evs = evFilter === "problems" ? d.events.filter((e) => e.error || e.kind === "refused") : d.events;
  return `<div class="panel" style="margin-bottom:16px"><div class="row"><div><span class="mono muted">${esc(d.run)}</span>
      <div class="title">${esc(d.role)}${d.ticket ? ` · ticket ${ticket ? `<a href="#/m/${encodeURIComponent(m.name)}/t/${encodeURIComponent(ticket.name)}" style="color:var(--blue)">${esc(d.ticket)}</a>` : esc(d.ticket)}` : ""}</div></div>
      ${d.outcome.result ? pill(d.outcome.result === "PASS" ? "pass" : "fail") : d.outcome.integrated ? pill("pass") : ""}</div>
    <div class="metrics">
      <div><div class="k">Model</div><div class="v" style="font-size:15px">${esc(d.model)}${d.thinking ? ` · ${esc(d.thinking)}` : ""}</div></div>
      <div><div class="k">Ran</div><div class="v" style="font-size:15px">${d.start ? hhmm(Date.parse(d.start)) + "–" + hhmm(Date.parse(d.end)) : "?"}</div></div>
      <div><div class="k">Length</div><div class="v">${isNaN(ms) ? "?" : dur(ms)}</div></div>
      <div><div class="k">Tool calls</div><div class="v">${d.calls}</div></div>
      <div><div class="k">Failed calls</div><div class="v"${d.errors ? ` style="color:var(--red)"` : ""}>${d.errors}</div></div>
      <div><div class="k">Refused</div><div class="v"${d.refused.length ? ` style="color:var(--red)"` : ""}>${d.refused.length}</div></div>
      <div><div class="k">Cost · tokens</div><div class="v" style="font-size:15px">${u.cost ? "$" + u.cost.toFixed(2) + " · " : ""}${fmtK(u.input || 0)} in · ${fmtK(u.output || 0)} out</div></div>
    </div></div>
    ${d.refused.length ? `<div class="panel" style="margin-bottom:16px"><h2>What the guard refused</h2>${d.refused.map((g) => `<div class="refusal"><div class="h"><span>${esc(g.rule)}</span><span class="muted">${esc(g.tool)}${g.at ? " · " + hhmm(Date.parse(g.at)) : ""}</span>
        <span class="spacer"></span><span class="today-${esc(g.today)}">${esc(TODAY[g.today] || g.today)}</span></div>
        <div class="b"><pre class="term mono" style="max-height:160px">${esc((() => { try { const j = JSON.parse(g.input); return j.command || JSON.stringify(j, null, 1); } catch { return g.input; } })())}</pre><div class="muted">${esc(g.why || "")}</div>${g.cwd ? `<div class="mono muted" style="font-size:11.5px">in ${esc(g.cwd)}</div>` : ""}</div></div>`).join("")}</div>` : ""}
    <div class="panel" style="margin-bottom:16px"><div class="row"><h2 style="margin:0">Events <span class="muted" style="text-transform:none;letter-spacing:0">${evs.length}${d.eventsTotal > d.events.length ? ` (last ${d.events.length} of ${d.eventsTotal})` : ""}</span></h2>
      <div class="tabs"><button type="button" data-evf="all" class="${evFilter === "all" ? "on" : ""}">All</button><button type="button" data-evf="problems" class="${evFilter === "problems" ? "on" : ""}">Failed and refused</button></div></div>
      <div class="evs" data-key="ev:${esc(d.dir)}" style="margin-top:10px">${evs.length ? evs.map((e) => `<div class="e${e.error || e.kind === "refused" ? " bad" : ""}"><span class="w">${e.at ? hhmm(Date.parse(e.at)) : ""}</span>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr))">
      <div class="panel"><details${d.output ? " open" : ""}><summary>Final answer (output.md)</summary><pre class="term mono" data-key="out:${esc(d.dir)}" style="max-height:420px">${esc(d.output || "none")}</pre></details></div>

}

// D98: Benchmarks, the factory engineer's view (bench.sh compare writes the files).
const AXES = { pass_rate: "pass rate", cost_per_trial: "cost per trial", median_turns: "median turns", mean_seconds: "seconds per case", mean_rounds: "rounds" };
let axX = "cost_per_trial", axY = "pass_rate";
const fmtAx = (k, v) => k === "pass_rate" ? `${Math.round(v * 1000) / 10}%` : k === "cost_per_trial" ? `$${Number(v).toFixed(2)}` : String(Math.round(v * 10) / 10);
function scatter(c) {
  const W = 640, H = 320, P = 48, xs = c.points.map((p) => p[axX]), ys = c.points.map((p) => p[axY]);
  const lo = (a) => Math.min(...a), hi = (a) => Math.max(...a);
  const sx = (v) => P + (hi(xs) === lo(xs) ? (W - 2 * P) / 2 : (v - lo(xs)) / (hi(xs) - lo(xs)) * (W - 2 * P));
  const sy = (v) => H - P - (hi(ys) === lo(ys) ? (H - 2 * P) / 2 : (v - lo(ys)) / (hi(ys) - lo(ys)) * (H - 2 * P));
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img" aria-label="${esc(AXES[axY])} versus ${esc(AXES[axX])}">
    <line x1="${P}" y1="${H - P}" x2="${W - P / 2}" y2="${H - P}" stroke="#262B35"/><line x1="${P}" y1="${P / 2}" x2="${P}" y2="${H - P}" stroke="#262B35"/>
    <text x="${W - P / 2}" y="${H - P + 30}" text-anchor="end">${esc(AXES[axX])} →</text><text x="${P - 8}" y="${P / 2}" text-anchor="end">↑</text>
    ${c.points.map((p) => `<g class="pt"><circle cx="${sx(p[axX])}" cy="${sy(p[axY])}" r="6" fill="${p.below_floor ? "none" : p.label === c.default ? "#9AA3B2" : p.pareto ? "#3DD68C" : "#6CB4FF"}" stroke="${p.below_floor ? "#FF7A6B" : "none"}" stroke-width="2"/>
      <text x="${sx(p[axX]) + (sx(p[axX]) > W / 2 ? -9 : 9)}" y="${sy(p[axY]) - 8}" text-anchor="${sx(p[axX]) > W / 2 ? "end" : "start"}">${esc(p.label)} · ${fmtAx(axY, p[axY])} · ${fmtAx(axX, p[axX])}${p.below_floor ? " · below the floor" : ""}</text></g>`).join("")}
  </svg>`;
}
function benchView(name) {
  const list = state.bench || [];
  if (!list.length) return `<div class="panel"><h2>Benchmarks</h2><p class="empty">No comparison yet. bench.sh add, bench.sh run (one config per run), then bench.sh compare (D98).</p></div>`;
  const c = list.find((x) => x.name === name) || list[0];
  const opts = (sel) => Object.entries(AXES).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(v)}</option>`).join("");
  const tbl = (key) => { const rows = c.breakdown?.[key] || []; if (!rows.length) return ""; const labels = c.points.map((p) => p.label);
    return `<table><tr><th>${esc(key)}</th>${labels.map((l) => `<th>${esc(l)}</th>`).join("")}</tr>${rows.map((r) => `<tr><td>${esc(r[key])}</td>${labels.map((l) => `<td>${esc(r[l])}</td>`).join("")}</tr>`).join("")}</table>`; };
  return `<div class="grid" style="gap:16px">
    <div class="panel"><div class="row"><h2 style="margin:0">Benchmark · ${esc(c.name)}</h2>
      ${list.length > 1 ? `<select id="bsel">${list.map((x) => `<option${x.name === c.name ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : ""}</div>
      <p style="margin:12px 0 4px">${esc(c.summary)}</p>${(c.warnings || []).map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}</div>
    <div class="grid recs">${c.recommendations.map((r) => `<div class="panel rec"><div class="k">${esc(r.kind)}</div>${r.label ? `<div class="v">${esc(r.label)}</div>
      <div class="stat"><span><b>${fmtAx("pass_rate", r.pass_rate)}</b> pass</span><span><b>${fmtAx("cost_per_trial", r.cost_per_trial)}</b>/trial</span></div>` : `<div class="v muted">None</div><div class="muted" style="font-size:12.5px">${esc(r.note)}</div>`}</div>`).join("")}</div>
    <div class="panel"><div class="row"><h2 style="margin:0">Configurations</h2><span><select id="axy">${opts(axY)}</select> vs <select id="axx">${opts(axX)}</select></span></div>
      ${scatter(c)}<p class="muted" style="font-size:12px">Grey: the default. Green: no other configuration above the quality floor (${fmtAx("pass_rate", c.floor ?? 0)}) is both better and cheaper. Red ring: below the floor, never recommended.</p></div>
    <div class="panel"><h2>By difficulty</h2>${tbl("difficulty") || `<p class="empty">No tiers.</p>`}</div>
    <div class="panel"><h2>By area</h2>${tbl("area") || `<p class="empty">No areas.</p>`}</div>
  </div>`;
}

// D122: the factory engineer's page: where rounds and your time go, which
// refusals today's guard would let through, and the causes the learning loop

function hbars(rows, key, fmt, color) {
  const max = Math.max(...rows.map((r) => r[key]), 0) || 1;
  return rows.map((r) => `<div style="display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:10px;align-items:center;margin:6px 0">
    <a href="#/m/${encodeURIComponent(r.name)}" class="mono" style="color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</a>
    <span style="height:12px;background:#222733;border-radius:3px"><span style="display:block;height:12px;width:${(100 * r[key]) / max}%;background:${color};border-radius:3px"></span></span>
    <span style="text-align:right;font-variant-numeric:tabular-nums">${fmt(r[key])}</span></div>`).join("");
}
function healthView() {
  const h = state.health || { missions: [], guard: { total: 0, byRule: [] }, causes: { total: 0, byClass: {} } };
  const g = h.guard, c = h.causes, ms = h.missions;
  const tile = (k, v, sub, color) => `<div class="panel rec"><div class="k">${k}</div><div class="v"${color ? ` style="color:${color}"` : ""}>${v}</div><div class="muted" style="font-size:12.5px">${sub}</div></div>`;
  const STATUS = (st) => /^fixed|^merged/i.test(st) ? "s-pass" : /^open/i.test(st) ? "s-fail" : "s-blocked";
  return `<div class="grid recs" style="margin-bottom:16px">
      ${tile("Guard refusals", g.total, g.total ? `${g.allowed} allowed by today's guard (fixed since) · ${g.refused} still refused${g.unknown ? ` · ${g.unknown} not replayable (F10)` : ""}` : "none archived", g.refused ? "var(--red)" : "")}
      ${tile("Causes classified", c.total, c.total ? `${c.open} open · ${Object.entries(c.byClass).map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}` : "no taxonomy.tsv on this machine (factory learn-loop)")}
      ${tile("Your decisions", ms.reduce((a, m) => a + m.decisions, 0), `over ${ms.length} mission${ms.length === 1 ? "" : "s"}`)}
      ${tile("Model cost", "$" + ms.reduce((a, m) => a + m.cost, 0).toFixed(2), "archived runs, or usage.tsv")}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-bottom:16px">
      <div class="panel"><h2>Cost per mission</h2>${ms.length ? hbars(ms, "cost", (v) => "$" + v.toFixed(2), "var(--blue)") : `<p class="empty">No mission.</p>`}</div>
      <div class="panel"><h2>Your decisions per mission</h2>${ms.length ? hbars(ms, "decisions", (v) => String(v), "var(--amber)") : `<p class="empty">No mission.</p>`}</div>
    </div>
    <div class="panel" style="margin-bottom:16px"><h2>Guard refusals by rule, judged again today</h2>
      ${g.byRule.length ? `<table><tr><th>Rule</th><th>Refused then</th><th>Allowed today</th><th>Still refused</th><th>Not replayable</th></tr>${g.byRule.map((r) => `<tr><td class="mono">${esc(r.rule)}</td><td>${r.total}</td><td style="color:var(--green)">${r.allowed}</td><td style="color:${r.refused ? "var(--red)" : "inherit"}">${r.refused}</td><td class="muted">${r.unknown}</td></tr>`).join("")}</table>
      <p class="muted" style="font-size:12.5px;margin-bottom:0">Allowed today: the refusal was a guard bug, fixed since. Still refused: either the guard is right, or the bug is still there; open the run from the mission's timeline to judge. Not replayable: guard.log cut the input at 300 characters (F10).</p>` : `<p class="empty">No refusal in the archived runs.</p>`}</div>
    <div class="panel"><h2>Causes · taxonomy.tsv</h2>
      ${(state.causes || []).length ? `<div style="overflow-x:auto"><table><tr><th>Id</th><th>Class</th><th>Mission</th><th>What happened</th><th>Cause</th><th>Cost</th><th>Status</th></tr>${state.causes.map((x) => `<tr><td class="mono">${esc(x.id)}</td><td>${esc(x.class)}</td><td class="mono">${esc(x.mission)}</td><td>${esc(x.event)}</td><td>${esc(x.cause)}</td><td>${esc(x.cost)}</td><td><span class="pill ${STATUS(x.status)}">${esc(x.status || "?")}</span></td></tr>`).join("")}</table></div>`
        : `<p class="empty">No classified cause on this machine. factory learn-loop writes the evidence; the classes go in .git/pi-factory/learn/taxonomy.tsv.</p>`}</div>`;
}

function render() {
  if (!state) return;
  const r = route(), m = r.m && mission(r.m), t = m && r.t && m.tickets.find((x) => x.name === r.t);
  if (r.h) {
    waitingBar();
    $("#crumbs").innerHTML = `<a href="#/">Needs you</a><span>·</span><a href="#/missions">Missions</a><span>·</span><span>Factory</span><span>›</span><a href="#/health">Health</a>`;
    $("#app").innerHTML = healthView();
    return;
  }
  if (r.b) {
    waitingBar();
    $("#crumbs").innerHTML = `<a href="#/missions">Missions</a><span>·</span><span>Factory</span><span>›</span><a href="#/bench">Benchmarks</a>`;
    $("#app").innerHTML = benchView(r.b === "-" ? "" : r.b);
    const bs = $("#bsel"); if (bs) bs.onchange = () => { location.hash = `#/bench/${encodeURIComponent(bs.value)}`; };
    const ax = $("#axx"), ay = $("#axy"); if (ax) ax.onchange = () => { axX = ax.value; render(); }; if (ay) ay.onchange = () => { axY = ay.value; render(); };
    return;
  }
  waitingBar();
  const crumbs = [`<a href="#/">Needs you</a>`, `<span>·</span><a href="#/missions">Missions</a>`, m ? "" : `<span>·</span><a href="#/health">Health</a>`];
  if (m) crumbs.push(`<span>›</span><a href="#/m/${encodeURIComponent(m.name)}">${esc(m.name)}</a>`);
  if (t) crumbs.push(`<span>›</span><span>${esc(t.name)}</span>`);
  if (m && r.run) crumbs.push(`<span>›</span><span>run ${esc(r.run.slice(0, 8))}</span>`);
  $("#crumbs").innerHTML = crumbs.join("");
  // The page redraws every poll: keep each log box where the person scrolled it.
  // A box at its bottom follows the run, like a terminal; a new box opens at
  // its bottom (the latest lines).
  const kept = {};
  document.querySelectorAll("[data-key]").forEach((el) => {
    kept[el.dataset.key] = { top: el.scrollTop, bottom: el.scrollHeight - el.scrollTop - el.clientHeight < 8 };
  });
  $("#app").innerHTML = m && r.run ? runView(m, r.run) : t ? ticketView(m, t) : m ? missionView(m) : r.m ? `<p class="err">No mission “${esc(r.m)}”.</p>` + leads() : r.list ? leads() : inboxView();
  document.querySelectorAll("[data-key]").forEach((el) => {
    const k = kept[el.dataset.key];
    el.scrollTop = !k || k.bottom ? el.scrollHeight : k.top;
  });
  document.querySelectorAll("[data-m]").forEach((el) => (el.onclick = () => go(el.dataset.m)));
  document.querySelectorAll("[data-dir]").forEach((el) => { if (el.dataset.dir) el.onclick = () => { location.hash = `#/m/${encodeURIComponent(r.m)}/run/${encodeURIComponent(el.dataset.dir)}`; }; });
  document.querySelectorAll("button[data-evf]").forEach((el) => (el.onclick = () => { evFilter = el.dataset.evf; render(); }));
  document.querySelectorAll("button[data-copy]").forEach((el) => (el.onclick = () => { navigator.clipboard?.writeText(el.dataset.copy).then(() => { el.textContent = "Copied"; }, () => {}); }));
  document.querySelectorAll("[data-t]").forEach((el) => (el.onclick = () => go(r.m, el.dataset.t)));
}

async function poll() {
  try {
    const res = await fetch("state.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text(); lastOk = Date.now();
    // Same snapshot: no redraw, so a selection or a scroll in progress survives.
    if (text !== lastText) { lastText = text; state = JSON.parse(text); render(); }
  } catch (e) { if (!state) $("#app").innerHTML = `<p class="err">No state.json yet (${esc(e.message)}). Run scripts/factory/cockpit.sh.</p>`; }
  $("#age").textContent = state ? `snapshot ${ago(state.generated)} ago` : "";
}

document.addEventListener("keydown", (e) => {
  if (!state || e.metaKey || e.ctrlKey || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const r = route(), m = r.m && mission(r.m);
  const items = m ? m.tickets : state.missions;
  if (e.key === "b" || e.key === "B") { location.hash = "#/bench"; }
  else if (e.key === "h" || e.key === "H") { location.hash = "#/health"; }
  else if (e.key === "l" || e.key === "L") { sel = 0; go(""); }
  else if (e.key === "n" || e.key === "N") { location.hash = "#/"; }
  else if (e.key === "m" || e.key === "M") { const name = m ? m.name : (state.missions[sel] || state.missions[0])?.name; if (name) go(name); }
  else if ((e.key === "r" || e.key === "R") && m) { const t = r.t ? m.tickets.find((x) => x.name === r.t) : (m.tickets[sel] || active(m)); if (t) go(m.name, t.name); }
  else if (e.key === "Escape") { if (r.t || r.run) go(r.m); else if (r.m) go(""); else if (r.list) location.hash = "#/"; }
  else if (e.key === "ArrowDown" || e.key === "j") { sel = Math.min(sel + 1, items.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp" || e.key === "k") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "Enter") { if (m && !r.t && m.tickets[sel]) go(m.name, m.tickets[sel].name); else if (!m && state.missions[sel]) go(state.missions[sel].name); }
});
window.addEventListener("hashchange", () => { sel = 0; render(); });
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
